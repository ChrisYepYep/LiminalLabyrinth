<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOS Typewriter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Outer Container scaled down by 50% */
        .monitor-container {
            position: relative;
            display: inline-block;
            max-width: 50%;
            z-index: 10;
        }

        /* Whole Screen Wrapper */
        .crt-screen-wrapper {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Monitor frame image sitting on top of the bulged elements */
        .monitor-bg {
            display: block;
            max-width: 100%;
            height: auto;
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        /* Sub-wrapper containing everything beneath the monitor bezel */
        .bulged-layers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;

            /* Applies the inverted bulge effect ONLY to screen content & glare */
            filter: url(#crt-bulge);
        }

        /* Screen overlay area for text */
        .screen-content {
            position: absolute;
            top: 14%;
            left: 14%;
            width: 60%;
            height: 55%;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 15px;
            box-sizing: border-box;
            z-index: 1;
            overflow: hidden;
        }

        /* Subtle CRT Scanlines Effect */
        .screen-content::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* CRT Screen Flicker Effect */
        .screen-content::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.05);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: crtFlicker 0.15s infinite;
        }

        @keyframes crtFlicker {
            0% { opacity: 0.1; }
            50% { opacity: 0.02; }
            100% { opacity: 0.08; }
        }

        /* Light layer overlay with lowered opacity */
        .monitor-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            pointer-events: none;
            z-index: 3;
        }

        .typewriter-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: #00ff66;
            text-align: left;
            min-height: 1.4em;
            margin: 0;
            position: relative;
            z-index: 1;

            /* Soft CRT blur / phosphor bleed */
            filter: blur(0.4px);
            
            /* Green glow effect */
            text-shadow: 
                0 0 2px rgba(127, 255, 0, 0.9),
                0 0 4px rgba(0, 255, 100, 0.8),
                0 0 6px rgba(0, 255, 100, 0.6),
                0 0 8px rgba(0, 255, 100, 0.4);
        }

        .typewriter-text.typing::after {
            content: '_';
            display: inline-block;
            opacity: 1;
            animation: blink 0.8s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- SVG Displacement Map for Inverted CRT Bulge Effect -->
    <svg style="display: none;">
        <defs>
            <filter id="crt-bulge">
                <feImage result="map" xlink:href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><radialGradient id='g' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='%23ffffff'/><stop offset='100%' stop-color='%23808080'/></radialGradient><rect width='100' height='100' fill='url(%23g)'/></svg>"/>
                <feDisplacementMap in="SourceGraphic" in2="map" scale="50" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div class="monitor-container">
        <div class="crt-screen-wrapper">
            <!-- Monitor Base Image (On top, unfiltered) -->
            <img class="monitor-bg" src="https://github.com/ChrisYepYep/LiminalLabyrinth/blob/main/images/crtmon.png?raw=true" alt="CRT Monitor">
            
            <!-- Bulged Layers Container (Underneath) -->
            <div class="bulged-layers">
                <!-- Screen Content Area -->
                <div class="screen-content">
                    <p id="dos-text" class="typewriter-text" data-full-text="[SYS_INIT] Loading geometry pipeline... DONE"></p>
                </div>

                <!-- Light Glare Overlay -->
                <img class="monitor-light" src="https://github.com/ChrisYepYep/LiminalLabyrinth/blob/main/images/crtlight.png?raw=true" alt="CRT Glare">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('dos-text');
            const fullText = el.getAttribute('data-full-text');

            const initialDelay = 2000; // 2 second pause before typing starts
            const typingSpeed  = 85;   // Milliseconds per character
            const loopPause    = 12000; // 12 second pause at the end before repeating

            function startTypewriter() {
                el.textContent = '';
                el.classList.remove('typing');

                setTimeout(() => {
                    let charIndex = 0;

                    const timer = setInterval(() => {
                        if (charIndex < fullText.length) {
                            el.textContent += fullText.charAt(charIndex);
                            charIndex++;
                        } else {
                            clearInterval(timer);
                            el.classList.add('typing');

                            setTimeout(() => {
                                startTypewriter();
                            }, loopPause);
                        }
                    }, typingSpeed);

                }, initialDelay);
            }

            startTypewriter();
        });
    </script>

</body>
</html>
